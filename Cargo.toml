[workspace]
resolver = "2"
members = ["mtproto", "ntg", "bot"]
exclude = ["vendor/ferogram"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["ParvatiMusic"]
repository = "https://github.com/ankit-chaubey/ferogram"
homepage = "https://github.com/ankit-chaubey/ferogram"

[workspace.dependencies]
ferogram = { path = "vendor/ferogram/ferogram", features = ["parsers"] }

[profile.dev]
debug = 0

[profile.dev.package."*"]
debug = false

[profile.test]
debug = 0
